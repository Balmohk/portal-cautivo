<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi Acceso</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      width: 90%;
      max-width: 380px;
      background: #1e293b;
      padding: 30px 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    
    /* Contenedor de logos */
    .logos-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    .logo-img {
      max-height: 45px;
      max-width: 140px;
      object-fit: contain;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 22px;
    }
    .group {
      text-align: left;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 11px;
      margin-bottom: 6px;
      text-transform: uppercase;
      color: #cbd5e1;
      letter-spacing: 0.5px;
    }
    input[type=email] {
      width: 100%;
      padding: 12px;
      border: 1px solid #475569;
      border-radius: 6px;
      background: #334155;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    input[type=email]:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- CONTENEDOR DE LOGOS -->
    <div class="logos-container">
      <!-- Reemplazá las URLs de src por los links directos a tus logos -->
      <img class="Balmohk.png" src="Balmohk.png" alt="Logo 1">
      <img class="logo-img" src="LOGO_2_URL" alt="Logo 2">
    </div>

    <h2>ACCESO WI-FI</h2>
    <p>Ingresá tu correo electrónico para conectarte a la red.</p>

    <form id="wifiForm" action="http://$PORTAL_ACTION$" method="post">
      <input type="hidden" name="43211234" value="$PORTAL_ZONE$">
      <input type="hidden" name="redirurl" value="$PORTAL_REDIRURL$">
      <input type="hidden" name="magic" value="$MAGIC$">

      <div class="group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="username" placeholder="tu@email.com" required>
      </div>

      <button type="submit">Conectarme</button>
    </form>
  </div>

  <script>
    document.getElementById('wifiForm').addEventListener('submit', function() {
      var emailVal = document.querySelector('input[name="username"]').value;
      // Tu URL de Google Apps Script
      var scriptURL = 'TU_URL_DE_GOOGLE_APPS_SCRIPT';

      if (navigator.sendBeacon) {
        navigator.sendBeacon(scriptURL, JSON.stringify({ email: emailVal }));
      }
    });
  </script>

</body>
</html>
