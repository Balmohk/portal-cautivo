
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Wi-Fi</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --input-bg: #334155;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 400px;
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      text-align: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      text-transform: uppercase;
      color: #cbd5e1;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #475569;
      border-radius: 6px;
      background-color: var(--input-bg);
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    input[type="email"]:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
    }

    button:hover {
      background-color: #7dd3fc;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">ACCESO WI-FI</div>
    <h2>Bienvenido</h2>
    <p>Ingresa tu correo electrónico para acceder a Internet.</p>

    <!-- Acción interna del FortiGate para validar el acceso -->
    <form id="wifiForm" action="http://$PORTAL_ACTION$" method="post">
      <input type="hidden" name="43211234" value="$PORTAL_ZONE$">
      <input type="hidden" name="redirurl" value="$PORTAL_REDIRURL$">
      <input type="hidden" name="magic" value="$MAGIC$">

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="username" placeholder="tu@email.com" required>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="terms" required>
        <label for="terms">Acepto los términos y condiciones de servicio.</label>
      </div>

      <button type="submit">Conectar</button>
    </form>
  </div>

  <script>
    document.getElementById('wifiForm').addEventListener('submit', function(e) {
      const email = document.querySelector('input[name="username"]').value;
      const scriptURL = 'https://script.google.com/macros/s/AKfycbxEWC8l60F7THtSYJGeNghZ7t0rmGZ8Or-PXpc5T6dW6ZuyQ9neTvapox29adRCBPAt-Q/exec';

      // Envía los datos a Google Sheets en segundo plano mediante sendBeacon
      if (navigator.sendBeacon) {
        navigator.sendBeacon(scriptURL, JSON.stringify({ email: email }));
      } else {
        fetch(scriptURL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
      }
    });
  </script>

</body>
</html>
